<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster Raid - Ultimate Legends (30 Classes & Skill Persistence)</title>
    <style>
        :root {
            --bg-main: #09090b; --bg-panel: #18181b; --bg-card: #27272a;
            --accent: #f59e0b; --text-main: #f4f4f5; --text-muted: #a1a1aa;
            --hp-color: #ef4444; --mp-color: #3b82f6; --sp-color: #10b981; 
            --ult-color: linear-gradient(90deg, #f59e0b, #ef4444);
            --boss-hp: linear-gradient(90deg, #9333ea, #db2777);
            --combo-color: #22d3ee; --evolve-color: #ec4899; --trans-color: #38bdf8;
            --fast-color: #22c55e;
        }

        body {
            font-family: 'Pretendard', sans-serif; background-color: var(--bg-main);
            color: var(--text-main); margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        
        h1 { color: var(--accent); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .subtitle { color: var(--text-muted); margin-bottom: 20px; font-size: 14px; }
        
        #game-container {
            width: 100%; max-width: 1100px; background-color: var(--bg-panel);
            border: 1px solid #3f3f46; border-radius: 12px; padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        .mode-select { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
        .mode-btn { padding: 10px 20px; background: #27272a; color: #fff; border: 1px solid #52525b; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .mode-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

        .screen { display: none; }
        .screen.active { display: block; }

        .party-slots { display: flex; justify-content: center; gap: 20px; margin-bottom: 15px; }
        .slot { 
            width: 180px; height: 140px; border: 2px dashed #52525b; border-radius: 12px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            cursor: pointer; transition: 0.2s; background: var(--bg-card); text-align: center; padding: 5px;
        }
        .slot.filled { border-style: solid; border-color: var(--accent); box-shadow: 0 0 15px rgba(245, 158, 11, 0.15); }
        .slot-name { font-size: 14px; font-weight: bold; }
        .slot-gear { font-size: 11px; color: var(--accent); margin-top: 2px; line-height: 1.2; }
        .slot-passive { font-size: 9px; color: var(--evolve-color); font-weight: bold; margin-top: 2px; }
        .slot-trans { font-size: 9px; color: var(--trans-color); font-weight: bold; margin-top: 2px; }
        .slot-cancel { font-size: 11px; color: #ef4444; margin-top: 3px; display: none; }
        .slot.filled .slot-cancel { display: block; }

        .lobby-control-bar { display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); padding: 10px 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #52525b; }
        .stage-select-box { display: flex; align-items: center; gap: 10px; }
        .stage-select-box select { background: #000; color: #fff; border: 1px solid var(--accent); padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        
        .fast-mode-toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: bold; font-size: 13px; color: var(--fast-color); background: #064e3b; padding: 6px 12px; border-radius: 8px; border: 1px solid #059669; }
        .fast-mode-toggle input { cursor: pointer; width: 16px; height: 16px; accent-color: var(--fast-color); }

        .class-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; text-align: left; max-height: 330px; overflow-y: auto; padding-right: 5px; }
        .class-btn { 
            background-color: var(--bg-card); color: var(--text-main); border: 1px solid #52525b; 
            padding: 12px; border-radius: 10px; cursor: pointer; transition: 0.2s; 
            display: flex; flex-direction: column; gap: 6px; 
        }
        .class-btn:hover { border-color: var(--accent); transform: translateY(-2px); }
        .class-name { font-weight: 800; font-size: 15px; }
        .class-desc { font-size: 11px; color: var(--text-muted); line-height: 1.3; }

        .panel-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
        .gold-display { font-size: 16px; font-weight: bold; color: var(--accent); }
        
        .primary-btn { 
            padding: 14px 40px; font-size: 16px; font-weight: bold; 
            background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; border: none; border-radius: 25px; 
            cursor: pointer; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4); 
        }

        .boss-panel { background: #271018; padding: 15px; border-radius: 12px; border: 1px solid #be123c; text-align: center; margin-bottom: 15px; }
        .boss-name { font-size: 22px; font-weight: 900; color: #fb7185; }
        .status-tags { display: flex; justify-content: center; gap: 8px; margin: 8px 0; min-height: 22px; flex-wrap: wrap; }
        .status-tag { background: #881337; color: #fecdd3; padding: 3px 10px; border-radius: 10px; font-size: 11px; font-weight: bold; }
        
        .party-panel { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 15px; }
        .hero-card { background-color: var(--bg-card); padding: 12px; border-radius: 10px; border: 2px solid transparent; opacity: 0.5; transition: 0.3s; }
        .hero-card.active { border-color: var(--accent); opacity: 1; transform: translateY(-3px); }
        .hero-card.dead { filter: grayscale(100%); opacity: 0.3; }
        
        .stat-text { font-size: 10px; margin: 4px 0 2px 0; display: flex; justify-content: space-between; font-weight: bold; }
        .bar-container { background-color: #000; height: 8px; border-radius: 4px; overflow: hidden; border: 1px solid #3f3f46; }
        .bar { height: 100%; transition: width 0.3s; }
        
        #battle-log { background-color: #000; color: #a3e635; height: 160px; overflow-y: auto; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 13px; line-height: 1.5; margin-bottom: 15px; border: 1px solid #52525b; }
        
        .action-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-height: 200px; overflow-y: auto; }
        .action-btn { 
            padding: 8px; background-color: #27272a; color: white; border: 1px solid #52525b; 
            border-radius: 8px; cursor: pointer; font-size: 11px; font-weight: bold; 
            display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center;
        }
        .action-btn:hover:not(:disabled) { background-color: #3f3f46; border-color: var(--accent); }
        .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-ult { border-color: var(--accent); color: var(--accent); }
        .btn-awake { border-color: var(--evolve-color); color: var(--evolve-color); background: #3b0764; }
        .btn-trans { border-color: var(--trans-color); color: var(--trans-color); background: #0c4a6e; }
        .action-cost { font-size: 9px; color: var(--text-muted); }

        .control-box { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
    </style>
</head>
<body>

    <h1>Monster Raid</h1>
    <div class="subtitle">Ultimate Legends (30 Classes & Skill Persistence)</div>

    <div id="game-container">
        <div class="mode-select">
            <button class="mode-btn active" id="mode-pve-btn" onclick="switchMode('pve')">⚔️ 싱글 레이드 모드 (1~100단계)</button>
            <button class="mode-btn" id="mode-pvp-btn" onclick="switchMode('pvp')">🛡️ 1:1 핫시트 PVP 모드</button>
        </div>

        <div id="selection-screen" class="screen active">
            <h2 style="color: #fff; margin-bottom: 12px; font-size: 18px;" id="select-title">영웅 선택 및 장비 강화</h2>
            
            <div class="lobby-control-bar">
                <div class="stage-select-box" id="pve-stage-box">
                    <span style="font-weight:bold; font-size:13px;">🚩 도전 스테이지:</span>
                    <select id="stage-select" onchange="changeSelectedStage()"></select>
                </div>
                <label class="fast-mode-toggle">
                    <input type="checkbox" id="fast-mode-checkbox" onchange="toggleFastMode()"> ⚡ Fast Mode (+10000% 보상/경험치)
                </label>
            </div>

            <div class="party-slots" id="party-slots">
                <div class="slot" onclick="cancelHero(0)" id="slot-0"><span class="slot-name">비어있음</span><span class="slot-gear">무기 없음</span><span class="slot-cancel">취소하기</span></div>
                <div class="slot" onclick="cancelHero(1)" id="slot-1"><span class="slot-name">비어있음</span><span class="slot-gear">무기 없음</span><span class="slot-cancel">취소하기</span></div>
                <div class="slot" onclick="cancelHero(2)" id="slot-2"><span class="slot-name">비어있음</span><span class="slot-gear">무기 없음</span><span class="slot-cancel">취소하기</span></div>
            </div>
            <div class="class-grid" id="class-buttons"></div>
            
            <div class="panel-controls">
                <div class="gold-display">💰 골드: <span id="player-gold">500</span>G</div>
                <button class="primary-btn" id="start-btn" style="display:none;" onclick="startBattle()">전투 시작!</button>
            </div>
        </div>

        <div id="battle-screen" class="screen">
            <div class="boss-panel">
                <div class="boss-name" id="boss-name">Boss Name</div>
                <div id="boss-phase" style="color: var(--accent); font-size: 13px; margin: 4px 0; font-weight: bold;">[전투 중]</div>
                <div class="status-tags" id="boss-statuses"></div>
                <div class="stat-text" style="color: white; margin-top: 6px;"><span>HP</span> <span id="boss-hp-txt">0 / 0</span></div>
                <div class="bar-container" style="height: 14px;"><div id="boss-hp" class="bar" style="background: var(--boss-hp);"></div></div>
            </div>

            <div class="party-panel" id="party-panel"></div>
            <div id="battle-log"></div>
            
            <div class="action-btns" id="action-btns"></div>
            
            <div class="control-box" id="next-control" style="display:none;">
                <button class="primary-btn" onclick="nextStage()">다음 스테이지 진행 ➔</button>
                <button class="mode-btn" onclick="returnToSelection()">장비 강화 / 로비로</button>
            </div>
        </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            } else if (type === 'attack') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'skill') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.2);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'ult') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.5);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            } else if (type === 'trans') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(350, now);
                osc.frequency.exponentialRampToValueAtTime(1400, now + 0.6);
                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                osc.start(now); osc.stop(now + 0.6);
            } else if (type === 'heal') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(554, now + 0.1);
                osc.frequency.setValueAtTime(659, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                osc.start(now); osc.stop(now + 0.35);
            } else if (type === 'victory') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.15);
                osc.frequency.setValueAtTime(783.99, now + 0.3);
                osc.frequency.setValueAtTime(1046.50, now + 0.45);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.7);
                osc.start(now); osc.stop(now + 0.7);
            }
        }

                const cls = baseClassData[key];
                const storedData = classPersistentStorage[key];
                const gearName = classGearData[key][storedData.gearLevel - 1];
                let gearPassiveHtml = storedData.gearLevel === 10 ? `<span style="font-size:10px; color:var(--evolve-color); font-weight:bold;">✨ 장비 각성 스킬 해제!</span>` : '';
                let transHtml = storedData.transcendentUnlocked ? `<span style="font-size:10px; color:var(--trans-color); font-weight:bold;">🌌 [초월의 길] 완성됨!</span>` : '';
                container.innerHTML += `
                    <button class="class-btn" onclick="playSound('click'); selectHero('${key}')">
                        <div style="display:flex; justify-content:space-between;">
                            <span class="class-name">${cls.name}</span>
                            <span style="font-size:10px; color:var(--text-muted);">${cls.role}</span>
                        </div>
                        <span class="class-desc">${cls.desc}</span>
                        <div style="font-size:10px; color:var(--accent);">🗡️ 장비: ${gearName} (+${storedData.gearLevel})</div>
                        ${gearPassiveHtml}
                        ${transHtml}
                    </button>`;
            });
            updateStageDropdown();
            updateSelectionUI();
        }

        function updateStageDropdown() {
            const selectEl = document.getElementById('stage-select');
            selectEl.innerHTML = '';
            for (let i = 0; i <= maxUnlockedStage; i++) {
                selectEl.innerHTML += `<option value="${i}" ${i === selectedStageIndex ? 'selected' : ''}>${bossData[i].name}</option>`;
            }
        }

        function changeSelectedStage() {
            const selectEl = document.getElementById('stage-select');
            selectedStageIndex = parseInt(selectEl.value);
        }

        function selectHero(key) {
            let maxParty = gameMode === 'pvp' ? 2 : 3;
            if (selectedClassKeys.length >= maxParty) return;
            if (selectedClassKeys.includes(key)) return;
            
            selectedClassKeys.push(key);
            updateSelectionUI();
        }

        function cancelHero(index) {
            playSound('click');
            if (index < selectedClassKeys.length) {
                selectedClassKeys.splice(index, 1);
                updateSelectionUI();
            }
        }

        function upgradeGear(key) {
            playSound('click');
            let storedData = classPersistentStorage[key];
            let cost = storedData.gearLevel * 100;
            if (playerGold >= cost && storedData.gearLevel < 10) {
                playerGold -= cost;
                storedData.gearLevel++;
                updateSelectionUI();
            } else if (playerGold < cost) {
                alert('골드가 부족합니다!');
            }
        }

        function updateSelectionUI() {
            document.getElementById('player-gold').innerText = playerGold;
            let maxParty = gameMode === 'pvp' ? 2 : 3;
            
            document.getElementById('pve-stage-box').style.display = (gameMode === 'pve') ? 'flex' : 'none';

            for (let i = 0; i < 3; i++) {
                const slot = document.getElementById(`slot-${i}`);
                if (i < maxParty) {
                    slot.style.display = 'flex';
                    if (i < selectedClassKeys.length) {
                        const key = selectedClassKeys[i];
                        const clsInfo = baseClassData[key];
                        const storedData = classPersistentStorage[key];
                        const gearName = classGearData[key][storedData.gearLevel - 1];
                        let gearPassiveHtml = storedData.gearLevel === 10 ? `<span class="slot-passive">✨ 각성 개방됨</span>` : '';
                        let transHtml = storedData.transcendentUnlocked ? `<span class="slot-trans">🌌 초월의 길 완성</span>` : '';
                        slot.innerHTML = `
                            <span class="slot-name">${clsInfo.name}</span>
                            <span class="slot-gear">${gearName} (+${storedData.gearLevel})</span>
                            ${gearPassiveHtml}
                            ${transHtml}
                            <button style="margin-top:2px; font-size:10px; padding:2px 6px; cursor:pointer;" onclick="event.stopPropagation(); upgradeGear('${key}')">강화 (${storedData.gearLevel*100}G)</button>
                            <span class="slot-cancel" onclick="event.stopPropagation(); cancelHero(${i})">취소</span>`;
                        slot.classList.add('filled');
                    } else {
                        slot.innerHTML = `<span class="slot-name">비어있음</span><span class="slot-gear">무기 없음</span><span class="slot-cancel">취소하기</span>`;
                        slot.classList.remove('filled');
                    }
                } else {
                    slot.style.display = 'none';
                }
            }
            
            let reqCount = gameMode === 'pvp' ? 2 : 3;
            document.getElementById('start-btn').style.display = selectedClassKeys.length === reqCount ? 'inline-block' : 'none';
        }

        function switchMode(mode) {
            playSound('click');
            gameMode = mode;
            selectedClassKeys = [];
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`mode-${mode}-btn`).classList.add('active');
            document.getElementById('select-title').innerText = mode === 'pve' ? '영웅 선택 및 장비 강화' : '각 플레이어의 영웅 1인씩 선택 (총 2인)';
            renderClassSelection();
        }

        function startBattle() {
            playSound('click');
            party = selectedClassKeys.map((key, index) => {
                const baseData = baseClassData[key];
                const storedData = classPersistentStorage[key];
                let bonusAtk = (storedData.gearLevel - 1) * 8; 
                if (storedData.gearLevel === 10) bonusAtk += 50; 
                if (storedData.transcendentUnlocked) bonusAtk += 100;
                
                // 영구 저장소에 있는 스킬 상태(레벨/경험치)를 그대로 불러옴
                let activeSkills = JSON.parse(JSON.stringify(storedData.skills));
                
                if (storedData.gearLevel === 10 && baseData.awakeSkill && !activeSkills.some(s => s.isAwake)) {
                    activeSkills.push(baseData.awakeSkill);
                }

                if (storedData.transcendentUnlocked && baseData.transcendentSkills && !activeSkills.some(s => s.isTrans)) {
                    let transSkillsCopy = JSON.parse(JSON.stringify(baseData.transcendentSkills));
                    activeSkills.push(...transSkillsCopy);
                }

                return { 
                    ...baseData, 
                    id: index, 
                    gearKey: key, 
                    gearLevel: storedData.gearLevel, 
                    skills: activeSkills, 
                    maxHp: baseData.hp + (storedData.transcendentUnlocked ? 500 : 0), 
                    currentHp: baseData.hp + (storedData.transcendentUnlocked ? 500 : 0), 
                    maxRes: baseData.res, 
                    currentRes: baseData.res, 
                    currentUlt: 0, 
                    atk: baseData.atk + bonusAtk,
                    atkBuff: 0 
                };
            });

            let partyPanelHtml = '';
            party.forEach(h => {
                let weaponName = classGearData[h.gearKey][h.gearLevel - 1];
                let storedData = classPersistentStorage[h.gearKey];
                let gearPassiveBadge = h.gearLevel === 10 ? `<div style="font-size:9px; color:var(--evolve-color); font-weight:bold;">✨ 장비 각성 개방됨</div>` : '';
                let transBadge = storedData.transcendentUnlocked ? `<div style="font-size:9px; color:var(--trans-color); font-weight:bold;">🌌 초월의 길 개방 완료</div>` : '';
                partyPanelHtml += `
                    <div class="hero-card" id="hero-card-${h.id}">
                        <div style="font-weight:bold; font-size:13px; margin-bottom:2px;">${h.name}</div>
                        <div style="font-size:10px; color:var(--accent);">${weaponName} (+${h.gearLevel})</div>
                        ${gearPassiveBadge}
                        ${transBadge}
                        <div class="stat-text" style="margin-top:4px;"><span>HP</span> <span id="hp-txt-${h.id}">0/0</span></div>
                        <div class="bar-container"><div id="hp-bar-${h.id}" class="bar" style="background:var(--hp-color); width:100%;"></div></div>
                        <div class="stat-text"><span>${h.resType}</span> <span id="res-txt-${h.id}">0/0</span></div>
                        <div class="bar-container"><div id="res-bar-${h.id}" class="bar" style="background:${h.resType==='MP'?'var(--mp-color)':'var(--sp-color)'}; width:100%;"></div></div>
                        <div class="stat-text"><span>궁극기</span> <span id="ult-txt-${h.id}">0%</span></div>
                        <div class="bar-container"><div id="ult-bar-${h.id}" class="bar" style="background:var(--ult-color); width:0%;"></div></div>
                    </div>`;
            });
            document.getElementById('party-panel').innerHTML = partyPanelHtml;
            document.getElementById('battle-log').innerHTML = '';

            document.getElementById('selection-screen').classList.remove('active');
            document.getElementById('battle-screen').classList.add('active');
            document.getElementById('next-control').style.display = 'none';

            if (gameMode === 'pve') {
                bossIndex = selectedStageIndex;
                loadBoss();
            } else {
                initPvpBattle();
            }
        }

        // 스킬 레벨/경험치 상태를 영구 저장소에 동기화하는 함수
        function savePartySkillProgress() {
            party.forEach(h => {
                if (classPersistentStorage[h.gearKey]) {
                    classPersistentStorage[h.gearKey].skills = JSON.parse(JSON.stringify(h.skills));
                }
            });
        }

        function loadBoss() {
            if (bossIndex >= bossData.length) {
                playSound('victory');
                log(`<br><span style="color:#22c55e; font-size:16px;">🏆 100단계 모든 레이드 보스를 토벌했습니다! 세계 구원 성공!</span>`);
                document.getElementById('action-btns').innerHTML = '';
                return;
            }
            const bData = bossData[bossIndex];
            currentBoss = { ...bData, maxHp: bData.hp, currentHp: bData.hp };
            bossStatuses = {};
            
            document.getElementById('boss-name').innerText = currentBoss.name;
            log(`<br><span style="color:#fb7185;">⚠️ [레이드 시작] ${currentBoss.name} 등장!</span>`);
            
            activeHeroIndex = -1;
            nextHeroTurn();
        }

        function updateUI() {
            if (gameMode === 'pve') {
                document.getElementById('boss-name').innerText = currentBoss.name;
                document.getElementById('boss-hp-txt').innerText = `${Math.floor(Math.max(0, currentBoss.currentHp))} / ${currentBoss.maxHp}`;
                document.getElementById('boss-hp').style.width = `${(currentBoss.currentHp / currentBoss.maxHp) * 100}%`;
                document.getElementById('boss-phase').innerText = currentBoss.currentHp <= (currentBoss.maxHp / 2) ? '[페이즈 2: 광폭화]' : '[페이즈 1]';
                
                let statusHtml = '';
                for (let s in bossStatuses) {
                    statusHtml += `<span class="status-tag">${s} (${bossStatuses[s]}스택)</span>`;
                }
                document.getElementById('boss-statuses').innerHTML = statusHtml;
            }

            party.forEach(h => {
                document.getElementById(`hp-txt-${h.id}`).innerText = `${Math.floor(Math.max(0, h.currentHp))}/${h.maxHp}`;
                document.getElementById(`hp-bar-${h.id}`).style.width = `${(h.currentHp / h.maxHp) * 100}%`;
                
                document.getElementById(`res-txt-${h.id}`).innerText = `${Math.floor(Math.max(0, h.currentRes))}/${h.maxRes}`;
                document.getElementById(`res-bar-${h.id}`).style.width = `${(h.currentRes / h.maxRes) * 100}%`;
                
                document.getElementById(`ult-txt-${h.id}`).innerText = `${Math.floor(h.currentUlt)}%`;
                document.getElementById(`ult-bar-${h.id}`).style.width = `${h.currentUlt}%`;
                
                const card = document.getElementById(`hero-card-${h.id}`);
                card.classList.remove('active', 'dead');
                if (h.currentHp <= 0) card.classList.add('dead');
                else if (h.id === activeHeroIndex) card.classList.add('active');
            });
        }

        function log(msg) {
            const bLog = document.getElementById('battle-log');
            bLog.innerHTML += `<div>${msg}</div>`;
            bLog.scrollTop = bLog.scrollHeight;
        }

        function nextHeroTurn() {
            do { activeHeroIndex++; } while (activeHeroIndex < party.length && party[activeHeroIndex].currentHp <= 0);

            if (activeHeroIndex >= party.length) {
                activeHeroIndex = -1;
                document.getElementById('action-btns').innerHTML = ''; 
                updateUI();
                if (gameMode === 'pve') setTimeout(bossTurn, 1000);
            } else {
                renderActionButtons();
                updateUI();
                log(`▶ <span style="color:var(--accent);">[${party[activeHeroIndex].name}]</span>의 턴`);
            }
        }

        function renderActionButtons() {
            const hero = party[activeHeroIndex];
            const container = document.getElementById('action-btns');
            container.innerHTML = '';
            
            hero.skills.forEach((skill, idx) => {
                const canUse = skill.isUlt ? hero.currentUlt >= 100 : hero.currentRes >= skill.cost;
                let costText = skill.isUlt ? '궁극기 100%' : (skill.cost === 0 ? '소모 없음' : `${hero.resType} ${skill.cost}`);
                let skillTitle = skill.isAwake || skill.isTrans ? skill.name : (skill.level >= 10 ? `✨ [만렙Lv.10] ${skill.name}` : `${skill.name} (Lv.${skill.level})`);
                let extraText = '';
                
                if(skill.applyStatus) extraText += `<span style="color:#10b981; font-size:9px;">[${skill.applyStatus}]</span>`;
                if(skill.consumeStatus) extraText += `<span style="color:var(--combo-color); font-size:9px;">[콤보폭발]</span>`;
                if(skill.isRevive) extraText += `<span style="color:var(--trans-color); font-size:9px;">[아군 부활]</span>`;
                if(skill.isAwake) extraText += `<span style="color:var(--evolve-color); font-size:9px;">[장비각성기]</span>`;
                if(skill.isTrans) extraText += `<span style="color:var(--trans-color); font-size:9px;">[초월스킬]</span>`;

                let btnClass = skill.isUlt ? 'btn-ult' : (skill.isAwake ? 'btn-awake' : (skill.isTrans ? 'btn-trans' : ''));

                container.innerHTML += `
                    <button class="action-btn ${btnClass}" ${canUse ? '' : 'disabled'} onclick="useSkill(${idx})">
                        <span style="font-weight:bold;">${skillTitle}</span>
                        ${extraText}
                        <span class="action-cost">${costText}</span>
                    </button>`;
            });
            container.innerHTML += `
                <button class="action-btn" onclick="useFocus()">
                    <span>정신 집중</span>
                    <span style="color:#a1a1aa; font-size:9px;">[휴식]</span>
                    <span class="action-cost">자원 40 회복</span>
                </button>`;
        }

        function useFocus() {
            playSound('click');
            const hero = party[activeHeroIndex];
            hero.currentRes = Math.min(hero.maxRes, hero.currentRes + 40);
            log(` - ${hero.name}이(가) 자원을 40 회복했습니다.`);
            finishTurn();
        }

        function useSkill(skillIdx) {
            const hero = party[activeHeroIndex];
            const skill = hero.skills[skillIdx];
            
            if (skill.isUlt) {
                playSound('ult');
                hero.currentUlt = 0;
            } else if (skill.isAwake) {
                playSound('ult');
                hero.currentRes -= skill.cost;
            } else if (skill.isTrans) {
                playSound('trans');
                hero.currentRes -= skill.cost;
                hero.currentUlt = Math.min(100, hero.currentUlt + (skill.ultGen || 20));
            } else {
                playSound('skill');
                hero.currentRes -= skill.cost; 
                hero.currentUlt = Math.min(100, hero.currentUlt + (skill.ultGen || 0));
            }

            let levelBonus = 1;
            if (!skill.isAwake && !skill.isTrans) {
                let expGain = fastModeActive ? 100 : 1;
                skill.exp += expGain;
                let maxLevelReq = skill.level * 3;
                if (skill.exp >= maxLevelReq && skill.level < 10) {
                    skill.level++;
                    skill.exp = 0;
                    log(`🎉 <span style="color:var(--evolve-color); font-weight:bold;">[${hero.name}]의 [${skill.name}] 스킬이 레벨 ${skill.level}로 성장했습니다!</span>`);
                    
                    if (skillIdx === 0 && skill.level === 10) {
                        let stored = classPersistentStorage[hero.gearKey];
                        if (!stored.transcendentUnlocked && stored.transcendenceProgress === 0) {
                            stored.transcendenceProgress = 1;
                            playSound('trans');
                            log(`<br><span style="color:var(--trans-color); font-size:15px; font-weight:bold;">🌌 [초월의 길 이벤트 개방!] ${hero.name}의 기본 공격이 만렙(Lv.10)에 도달했습니다! 보스 3마리를 토벌하여 초월을 완성하세요! (현재 진행도: 1/3)</span>`);
                        }
                    }
                }
                levelBonus = 1 + (skill.level - 1) * 1.0;
            } else if (skill.isAwake) {
                levelBonus = 12.0;
            } else if (skill.isTrans) {
                levelBonus = 15.0;
            }

            // 행동 직후 즉시 스킬 진행도를 영구 저장소에 반영
            savePartySkillProgress();

            let totalAtk = hero.atk * (1 + hero.atkBuff);
            let variance = Math.floor(Math.random() * (totalAtk * 0.15));
            let multiplier = skill.dmg * levelBonus;
            let isCombo = false;

            if (skill.consumeStatus && gameMode === 'pve') {
                let currentStack = bossStatuses[skill.consumeStatus] || 0;
                if (currentStack > 0) {
                    isCombo = true;
                    multiplier = skill.comboDmg * levelBonus * currentStack; 
                    delete bossStatuses[skill.consumeStatus]; 
                }
            }

            let damage = Math.floor(totalAtk * multiplier + variance);
            playSound(damage > 100 ? 'attack' : 'skill');

            let healAmt = skill.heal ? Math.floor(hero.maxHp * skill.heal * levelBonus) : 0;
            
            let msg = ` - ${hero.name}의 <span style="font-weight:bold;">[${skill.name}]</span>!`;
            if (isCombo) msg += ` <span style="color:var(--combo-color); font-weight:bold;">★ 스택 콤보 폭발! ★</span>`;
            if (damage > 0) msg += ` (${gameMode==='pve'?'보스':'상대'}에게 ${damage} 피해)`;
            
            if (skill.applyStatus && gameMode === 'pve') {
                let stackAdd = 1;
                if (skill.level >= 10 || skill.isTrans) {
                    stackAdd = 3;
                    msg += ` <span style="color:var(--evolve-color);">[초월/만렙 효과 적용!]</span>`;
                } else if (skill.level >= 5) {
                    stackAdd = 2;
                }
                bossStatuses[skill.applyStatus] = (bossStatuses[skill.applyStatus] || 0) + stackAdd;
                msg += ` <span style="color:#10b981;">[${skill.applyStatus} +${stackAdd}스택]</span>`;
            }
            log(msg);

            if (gameMode === 'pve') {
                currentBoss.currentHp -= damage;
            } else {
                let targetId = activeHeroIndex === 0 ? 1 : 0;
                party[targetId].currentHp -= damage;
            }

            if (skill.isRevive) {
                let revivedCount = 0;
                party.forEach(h => {
                    if (h.currentHp <= 0) {
                        h.currentHp = Math.floor(h.maxHp * (skill.reviveHp || 0.5));
                        revivedCount++;
                        log(`   ↳ <span style="color:var(--trans-color); font-weight:bold;">✨ [기적의 부활!] ${h.name}이(가) 부활했습니다!</span>`);
                    }
                });
                if (revivedCount > 0) playSound('trans');
            }

            if (skill.applyBuff) {
                let buffVal = skill.buffVal;
                if (skill.isAoeBuff) {
                    party.forEach(h => { if (h.currentHp > 0) h.atkBuff += buffVal; });
                    log(`   ↳ <span style="color:var(--buff-color);">🎵 [버프] 파티 공격력 증가!</span>`);
                }
            }

            if (hero.isBuffer && skill.restoreRes) {
                let resRestoreAmt = skill.restoreRes;
                party.forEach(h => { if (h.currentHp > 0) h.currentRes = Math.min(h.maxRes, h.currentRes + resRestoreAmt); });
                playSound('heal');
                log(`   ↳ <span style="color:var(--mp-color);">✨ [지원] 파티원 전원 자원 회복!</span>`);
            }

            if (healAmt > 0) {
                playSound('heal');
                if (skill.isAoeHeal) {
                    party.forEach(h => { if(h.currentHp > 0) h.currentHp = Math.min(h.maxHp, h.currentHp + healAmt); });
                    log(`   ↳ <span style="color:#10b981;">(파티 전체 HP ${healAmt} 회복)</span>`);
                } else {
                    let alive = party.filter(h => h.currentHp > 0);
                    let target = alive.sort((a,b) => (a.currentHp/a.maxHp) - (b.currentHp/b.maxHp))[0];
                    target.currentHp = Math.min(target.maxHp, target.currentHp + healAmt);
                    log(`   ↳ <span style="color:#10b981;">[${target.name}] HP ${healAmt} 회복</span>`);
                }
            }

            finishTurn();
        }

        function finishTurn() {
            document.getElementById('action-btns').innerHTML = ''; 
            updateUI();
            savePartySkillProgress();

            if (gameMode === 'pve') {
                if (currentBoss.currentHp <= 0) {
                    playSound('victory');
                    let baseGold = 300 + (bossIndex * 150);
                    let goldGain = fastModeActive ? baseGold * 100 : baseGold;
                    playerGold += goldGain;
                    log(`<br><span style="color:#3b82f6; font-weight:bold;">[스테이지 클리어] ${currentBoss.name} 격파 성공! (보상 ${goldGain} 골드)</span>`);
                    
                    party.forEach(h => {
                        let stored = classPersistentStorage[h.gearKey];
                        if (stored.transcendenceProgress > 0 && !stored.transcendentUnlocked) {
                            stored.transcendenceProgress++;
                            log(`<span style="color:var(--trans-color);">🌌 [초월의 길] ${h.name}의 초월 진동 감지! 보스 토벌 진행도: ${stored.transcendenceProgress}/3</span>`);
                            if (stored.transcendenceProgress >= 3) {
                                stored.transcendentUnlocked = true;
                                playSound('trans');
                                log(`<br><span style="color:var(--trans-color); font-size:16px; font-weight:bold;">✨🎊 [초월의 길 동시 각성 완성!] ${h.name}이(가) 초월자로 각성했습니다! 초월 스킬 개방!</span>`);
                            }
                        }
                    });

                    if (bossIndex >= maxUnlockedStage && maxUnlockedStage < bossData.length - 1) {
                        maxUnlockedStage = bossIndex + 1;
                    }
                    selectedStageIndex = Math.min(bossData.length - 1, bossIndex + 1);

                    document.getElementById('next-control').style.display = 'flex'; 
                } else {
                    setTimeout(nextHeroTurn, 800);
                }
            } else {
                if (party[0].currentHp <= 0 || party[1].currentHp <= 0) {
                    playSound('victory');
                    let winner = party[0].currentHp > 0 ? '플레이어 1' : '플레이어 2';
                    log(`<br><span style="color:var(--accent); font-size:16px; font-weight:bold;">🏆 [PVP 승리] ${winner} 승리!</span>`);
                    return;
                }
                activeHeroIndex = activeHeroIndex === 0 ? 1 : 0;
                renderActionButtons();
                updateUI();
                log(`▶ <span style="color:var(--accent); font-weight:bold;">[${party[activeHeroIndex].name}]의 턴 (PVP)</span>`);
            }
        }

        function nextStage() {
            playSound('click');
            bossIndex++;
            document.getElementById('next-control').style.display = 'none';
            loadBoss();
        }

        function returnToSelection() {
            playSound('click');
            savePartySkillProgress();
            document.getElementById('battle-screen').classList.remove('active');
            document.getElementById('selection-screen').classList.add('active');
            renderClassSelection();
        }

        function bossTurn() {
            if (currentBoss.currentHp <= 0) return;
            let aliveHeroes = party.filter(h => h.currentHp > 0);
            if (aliveHeroes.length === 0) return;

            const isPhase2 = currentBoss.currentHp <= (currentBoss.maxHp / 2);
            let bossDmg = currentBoss.atk + Math.floor(Math.random() * (currentBoss.atk * 0.15));

            if(bossStatuses['기절']) {
                log(`<br><span style="color:#a1a1aa;">◀ [보스] 기절 상태로 행동을 못했습니다!</span>`);
                delete bossStatuses['기절'];
            } else {
                playSound('attack');
                if (isPhase2) {
                    log(`<br><span style="color:#fb7185; font-weight:bold;">◀ [보스] 광폭화 전체 공격!</span>`);
                    aliveHeroes.forEach(h => {
                        let dmg = Math.floor(bossDmg * 0.6);
                        h.currentHp -= dmg;
                        h.currentUlt = Math.min(100, h.currentUlt + 15); 
                        log(`   ↳ <span style="color:#fb7185;">${h.name}에게 ${dmg} 피해!</span>`);
                    });
                } else {
                    let target = aliveHeroes[Math.floor(Math.random() * aliveHeroes.length)];
                    log(`<br><span style="color:#fb7185; font-weight:bold;">◀ [보스] ${currentBoss.name}의 강력한 타격!</span>`);
                    target.currentHp -= bossDmg;
                    target.currentUlt = Math.min(100, target.currentUlt + 25);
                    log(`   ↳ <span style="color:#fb7185;">${target.name}에게 ${bossDmg} 피해!</span>`);
                }
            }

            updateUI();

            if (party.every(h => h.currentHp <= 0)) {
                log(`<br><span style="color:#ef4444; font-weight:bold;">[전멸] 파티가 모두 쓰러졌습니다... 부활 궁극기로 역전을 노려보세요!</span>`);
                document.getElementById('next-control').style.display = 'flex';
                return;
            }
            
            party.forEach(h => { if(h.currentHp > 0) h.currentRes = Math.min(h.maxRes, h.currentRes + 15); });
            setTimeout(nextHeroTurn, 1500);
        }

        function initPvpBattle() {
            activeHeroIndex = 0;
            log(`<br><span style="color:var(--accent); font-weight:bold;">⚔️ 핫시트 1:1 PVP 대전 시작!</span>`);
            renderActionButtons();
            updateUI();
        }

        renderClassSelection();
    </script>
</body>
</html>
